<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYOS — Register</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm">

        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold text-black tracking-tight">SYOS</a>
            <p class="text-xs text-gray-400 mt-1">Create your account</p>
        </div>

        <div class="bg-white border border-gray-200 rounded-2xl p-8">

            <h2 class="text-base font-semibold text-black mb-6">Create your account</h2>

            <div id="alert" class="hidden mb-4"></div>

            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Full name
                </label>
                <input type="text" id="fullname"
                    placeholder="John Silva"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Email address
                </label>
                <input type="email" id="email"
                    placeholder="you@example.com"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Phone number
                </label>
                <input type="tel" id="phone"
                    placeholder="0771234567"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Password
                </label>
                <input type="password" id="password"
                    placeholder="At least 4 characters"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Confirm password
                </label>
                <input type="password" id="confirm-password"
                    placeholder="Repeat password"
                    onkeydown="if(event.key==='Enter') register()"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <!-- Loyalty info -->
            <div class="mb-6 p-3 bg-gray-50 rounded-lg">
                <p class="text-xs font-medium text-black mb-1">SYOS Loyalty Program</p>
                <p class="text-xs text-gray-400">Earn 1 point per LKR 100 spent. Redeem points for discounts.</p>
            </div>

            <button onclick="register()" id="btn-register"
                class="w-full bg-black text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-900 active:scale-95 transition-all">
                Create account
            </button>

            <p class="text-center text-xs text-gray-400 mt-5">
                Already have an account?
                <a href="login.html" class="text-black underline underline-offset-2">Sign in</a>
            </p>

        </div>

        <p class="text-center mt-6">
            <a href="index.html" class="text-xs text-gray-400 hover:text-black transition-colors">
                ← Back to store
            </a>
        </p>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        async function register() {
            const fullName  = document.getElementById('fullname').value.trim();
            const email     = document.getElementById('email').value.trim();
            const phone     = document.getElementById('phone').value.trim();
            const password  = document.getElementById('password').value.trim();
            const confirm   = document.getElementById('confirm-password').value.trim();

            if (!fullName || !email || !phone || !password) {
                UI.showAlert('alert', 'Please fill in all fields.');
                return;
            }
            if (!email.includes('@')) {
                UI.showAlert('alert', 'Please enter a valid email address.');
                return;
            }
            if (!/^\d+$/.test(phone)) {
                UI.showAlert('alert', 'Phone number must contain digits only.');
                return;
            }
            if (password.length < 4) {
                UI.showAlert('alert', 'Password must be at least 4 characters.');
                return;
            }
            if (password !== confirm) {
                UI.showAlert('alert', 'Passwords do not match.');
                return;
            }

            UI.setLoading('btn-register', true, 'Creating account...', 'Create account');

            const data = await API.customers.register({ fullName, email, phone, password });

            if (data.success) {
                UI.showAlert('alert',
                    `Welcome to SYOS, ${data.fullName}! Redirecting to sign in...`,
                    'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                UI.showAlert('alert', data.error || 'Registration failed.');
                UI.setLoading('btn-register', false, '', 'Create account');
            }
        }
    </script>

</body>
</html>
