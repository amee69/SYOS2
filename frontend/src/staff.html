<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYOS — Staff Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-black min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm">

        <!-- Brand -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">SYOS</h1>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-widest">Staff Portal</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl p-8">

            <h2 class="text-base font-semibold text-black mb-6">Sign in to continue</h2>

            <!-- Alert -->
            <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <!-- Username -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Username
                </label>
                <input type="text" id="username"
                    placeholder="Enter username"
                    onkeydown="if(event.key==='Enter') login()"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Password
                </label>
                <input type="password" id="password"
                    placeholder="Enter password"
                    onkeydown="if(event.key==='Enter') login()"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors">
            </div>

            <!-- Role -->
            <div class="mb-6">
                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">
                    Role
                </label>
                <select id="role"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black transition-colors bg-white">
                    <option value="CASHIER">Cashier</option>
                    <option value="MANAGER">Manager</option>
                </select>
            </div>

            <!-- Submit -->
            <button onclick="login()" id="btn-login"
                class="w-full bg-black text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-900 active:scale-95 transition-all">
                Sign in
            </button>

        </div>

        <!-- Back to store -->
        <p class="text-center text-xs text-gray-600 mt-6">
            <a href="index.html" class="hover:text-white transition-colors">← Back to store</a>
        </p>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        // Redirect if already logged in
        const existing = Auth.getStaff();
        if (existing) {
            window.location.href = existing.role === 'MANAGER' ? 'dashboard.html' : 'pos.html';
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const role     = document.getElementById('role').value;

            if (!username || !password) {
                UI.showAlert('alert', 'Please enter your username and password.');
                return;
            }

            UI.setLoading('btn-login', true, 'Signing in...', 'Sign in');

            const data = await API.auth.loginStaff(username, password, role);

            if (data.success) {
                sessionStorage.setItem('staff', JSON.stringify(data));
                window.location.href = data.role === 'MANAGER' ? 'dashboard.html' : 'pos.html';
            } else {
                UI.showAlert('alert', 'Invalid credentials or insufficient role.');
                UI.setLoading('btn-login', false, '', 'Sign in');
            }
        }
    </script>

</body>
</html>
